[project]
name = "commkit"
version = "1.1.0"
description = "A Python library for high-performance digital communications research."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11",
    "numpy>=2.4",
    "scipy>=1.17",
    "numba>=0.65",
]

[project.optional-dependencies]
# CuPy with its pip-packaged CUDA toolkit libraries (cuBLAS, cuFFT, cuRAND,
# cuSOLVER, cuSPARSE, NVRTC), so no system CUDA toolkit is needed.
gpu = [
    "cupy-cuda13x[ctk]>=14.1",
]
# Running the example notebooks. Not required for the library itself.
notebook = [
    "jupyter>=1.1.1",
]
full = [
    "commkit[gpu,notebook]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["commkit"]
# CUDA kernel sources are loaded at runtime via importlib.resources and
# must ship with the package. py.typed marks the package as typed (PEP 561).
artifacts = ["commkit/_cuda/src/*.cu", "commkit/py.typed"]

[dependency-groups]
dev = [
    "bump-my-version>=1.2.7",
    "mypy>=2.1.0",
    "nbstripout>=0.9.1",
    "pytest>=8.3.5",
    "pytest-benchmark>=5.2.3",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.15",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--device=all --strict-markers"
# bench_* patterns exist for the explicit-only benchmarks/ suite;
# the default run still collects tests/ only via testpaths.
python_files = ["test_*.py", "bench_*.py"]
python_functions = ["test_*", "bench_*"]
filterwarnings = [
    "ignore::FutureWarning:cupyx",
    "ignore:.*cupyx.jit.rawkernel is experimental.*:UserWarning",
]
markers = [
    "gpu_only: mark test as requiring a GPU backend",
    "cpu_only: mark test as CPU-only",
    "requires_kernel(name): mark test as requiring a specific CUDA kernel",
]

[tool.coverage.run]
# Placeholder modules for planned work (FEC, nonlinear channel) are kept on
# purpose as reminders; they hold no code yet, so they are not measured.
omit = [
    "commkit/coding/*",
    "commkit/impairments/channel/nonlinear.py",
]

[tool.bumpversion]
current_version = "1.1.0"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
serialize = ["{major}.{minor}.{patch}"]
search = "{current_version}"
replace = "{new_version}"
regex = false
ignore_missing_version = false
ignore_missing_files = false
tag = true
sign_tags = false
tag_name = "v{new_version}"
tag_message = "Bump version: {current_version} -> {new_version}"
allow_dirty = true
commit = true
message = "Bump version: {current_version} -> {new_version}"
moveable_tags = []
commit_args = ""
setup_hooks = []
pre_commit_hooks = ["uv sync --all-extras", "git add uv.lock"]
post_commit_hooks = []

[[tool.bumpversion.files]]
filename = "pyproject.toml"

[[tool.bumpversion.files]]
filename = "commkit/__init__.py"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
# High-value, low-noise baseline: E/F (pycodestyle + pyflakes), I (import
# sorting), UP (pyupgrade - modernizes typing for a 3.12+ project), B (bugbear).
# SIM and RUF are deliberately left out for now; they fire mostly on stylistic
# choices and domain false-positives (Greek letters in math docstrings, int()
# casts, test tuple-unpacking) and can be ratcheted in per-module later, the
# same way mypy strictness is.
select = ["E", "F", "I", "UP", "B", "G"]
ignore = [
    "E501",  # line length is handled by the formatter; long strings/URLs are fine
    "B008",  # function calls in argument defaults (common in DSP signatures)
    "B905",  # zip() strict= is opinionated; lengths are invariant-guaranteed here
]
logger-objects = ["commkit.logger.logger"]

[tool.ruff.lint.per-file-ignores]
# Numba kernel factories rely on closures and loop-variable rebinding that
# trip bugbear's B023; tests intentionally use broad constructs.
"commkit/equalization/_kernels_*.py" = ["B023"]
# Package re-export hubs deliberately import names for the public namespace.
"commkit/equalization/__init__.py" = ["F401"]
"commkit/plotting/__init__.py" = ["F401"]
"commkit/recovery/__init__.py" = ["F401"]
"tests/**" = ["B011", "E741"]

[tool.mypy]
ignore_missing_imports = true
# Strictness is ratcheted per-module via overrides below as modules are
# cleaned up; the default stays lenient so the whole tree type-checks today.

[[tool.mypy.overrides]]
module = [
    "commkit._array",
    "commkit._dispersion",
    "commkit._overlap_save",
    "commkit.backend",
    "commkit.filtering",
    "commkit.logger",
    "commkit.mapping.*",
    "commkit.math",
]
# `strict` is global-only in mypy; these are its per-module flags.
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_any_generics = true
check_untyped_defs = true
warn_return_any = true

